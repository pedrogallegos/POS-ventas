spring:
  application:
    name: pos-api
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://127.0.0.1:5433/vamo_pos}
    username: ${POS_DB_USER:vamo_pos}
    password: ${POS_DB_PASSWORD:vamo_pos_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
